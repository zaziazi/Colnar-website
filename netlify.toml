# Netlify build + the form endpoint, so nothing has to be set in the dashboard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 22.12 or newer.
  NODE_VERSION = "22"
  # Netlify Forms captures a POST to any path on the site, so the reservation
  # form posts to the root. Point this at a Formspree URL or a function instead
  # and nothing else has to change.
  PUBLIC_FORM_ENDPOINT = "/"

# ------------------------------------------------------------ old pages
# The cellar page was folded into the tasting page; its old addresses follow.

[[redirects]]
  from = "/klet/"
  to = "/degustacija/"
  status = 301

[[redirects]]
  from = "/en/cellar/"
  to = "/en/tasting/"
  status = 301

# The addresses of the previous site (Webflow), so links and search results
# that point at them land on the matching page after colnar.si moves here.

[[redirects]]
  from = "/kontakt"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/contact"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/en/home"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/trgovina"
  to = "/vina/"
  status = 301

[[redirects]]
  from = "/checkout"
  to = "/vina/"
  status = 301

[[redirects]]
  from = "/product/penina-colnar"
  to = "/vina/penina/"
  status = 301

[[redirects]]
  from = "/product/grozdni-sok"
  to = "/vinoteka/"
  status = 301

[[redirects]]
  from = "/product/:slug"
  to = "/vina/:slug/"
  status = 301

# ------------------------------------------------- Klub zvestobe (Vinoteka)
# One static page serves every guest's card and every unsubscribe link; the
# script on it reads the token from the address. The /api/klub/* endpoints are
# Netlify functions (netlify/functions/klub-*.mts) with their own paths.

[[redirects]]
  from = "/klub/k/*"
  to = "/klub/kartica/"
  status = 200

[[redirects]]
  from = "/klub/odjava/*"
  to = "/klub/odjava/"
  status = 200

[functions]
  node_bundler = "esbuild"
