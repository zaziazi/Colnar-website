# ------------------------------------------------- Klub zvestobe (Vinoteka)
# The loyalty club was taken off the site on 2026-11-03 (its code is on the
# klub-archive branch). The QR on the counter and the card links in members'
# mails still point here, so they land on the wine bar's page.

